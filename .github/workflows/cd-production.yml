name: Frontend production

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      api_base_url: ${{ vars.PRODUCTION_API_BASE_URL || 'https://smartquote-api-h8czffe5b4dtg6d7.chilecentral-01.azurewebsites.net' }}

  deploy:
    name: Deploy validated build to production
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Get deployment identity token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: return await core.getIDToken()
          result-encoding: string
      - name: Publish production environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_BUSH_0F1889D10 }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
