name: CI - Frontend
on:
  push:
    branches-ignore: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_call:
    inputs:
      api_base_url:
        description: Public backend URL embedded in the validated build
        type: string
        default: http://localhost:8080

permissions:
  contents: read

jobs:
  check:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ inputs.api_base_url || 'http://localhost:8080' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check code style
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: npm run test:e2e
      - name: Upload validated application
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
