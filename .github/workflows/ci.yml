name: CI - Frontend
on:
  push:
    branches-ignore: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_call:
    inputs:
      api_base_url:
        description: Public backend URL embedded in the validated build
        type: string
        default: http://localhost:8080

permissions:
  contents: read

jobs:
  check:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ inputs.api_base_url || 'http://localhost:8080' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check code style
        run: npm run lint
      - name: Run unit tests
        env:
          NODE_V8_COVERAGE: .local/unit-coverage
        run: node --test --experimental-test-coverage --test-coverage-include='src/**' tests/unit/*.test.js
      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: .local/unit-coverage/
          include-hidden-files: true
          if-no-files-found: error
      - name: Build application
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: npm run test:e2e:ui
      - name: Upload validated application
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
  integration:
    name: Vue purchasing flow with real API and PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a pinned compatible backend revision
        env:
          BACKEND_REF: ${{ vars.SMARTQUOTE_BACKEND_TEST_REF }}
        run: |
          if [[ ! "$BACKEND_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Set repository variable SMARTQUOTE_BACKEND_TEST_REF to the backend commit SHA containing tests/run-tests.ps1. Push backend changes first."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: upc-pre-202620-1asi0732-9108-smartquote/smartquote-web-services
          ref: ${{ vars.SMARTQUOTE_BACKEND_TEST_REF }}
          path: .test-backend
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: .test-backend/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Record tested backend revision
        run: echo "SMARTQUOTE_BACKEND_COMMIT=$(git -C .test-backend rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Required HTTP and browser tests with isolated dependencies
        shell: pwsh
        run: |
          ./.test-backend/tests/run-tests.ps1 -Level Integration -ClientOnly -ClientDirectory $PWD.Path -ClientCommand 'npm run test:integration; if ($LASTEXITCODE -eq 0) { npm run test:e2e:live }'
      - name: Upload non-secret integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-integration-evidence
          path: |
            .local/integration-result.json
            .local/order-approved.pdf
            .local/vue-*.png
          include-hidden-files: true
          if-no-files-found: error
